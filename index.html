<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FCE – Reaction Time Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Reaction Time Test</h1>
    <p id="instruction">
      Click “Add Baseline Session” to build your baseline (3–5 sessions).
      Click “Run Check” to compare today vs baseline.
      Early clicks count as false starts.
    </p>
    <!-- Controls -->
    <div class="controls">
      <label for="trialCount">Trials:</label>
      <input id="trialCount" type="number" min="3" max="20" value="5" />

      <button id="startBaselineBtn">Add Baseline Session</button>
      <button id="startCheckBtn">Run Check</button>
      <button id="resetBtn" class="secondary">Reset</button>
    </div>

    <div id="testArea" class="test-area hidden"></div>

    <!-- Session panel -->
    <div class="panel">
      <h2>Session</h2>
      <p id="progress"></p>
      <ul id="trialList"></ul>
      <p id="summary"></p>
    </div>

    <!-- Baseline panel -->
    <div class="panel">
      <h2>Baseline</h2>
      <p id="baselineInfo">No baseline sessions recorded.</p>

      <div class="baseline-actions">
        <button id="clearBaselineBtn" class="danger">Clear baseline</button>
      </div>
    
      <ul id="baselineList"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
