<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FCE – Reaction Time Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Reaction Time Test</h1>
    <p id="instruction">
      Click “Start Session”, then tap as fast as you can when it turns green.
      Early clicks are counted as false starts.
    </p>

    <div class="controls">
      <label for="trialCount">Trials:</label>
      <input id="trialCount" type="number" min="3" max="20" value="5" />
      <button id="startBtn">Start Session</button>
      <button id="resetBtn" class="secondary">Reset</button>
    </div>

    <div id="testArea" class="test-area hidden"></div>

    <div class="panel">
      <h2>Session</h2>
      <p id="progress"></p>
      <ul id="trialList"></ul>
      <p id="summary"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
