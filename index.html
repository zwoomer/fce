<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FCE – Reaction Time Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Reaction Time Test</h1>
    <p id="instruction">
      Click “Start”, then tap the screen as fast as you can when it turns green.
    </p>

    <button id="startBtn">Start</button>

    <div id="testArea" class="test-area hidden"></div>

    <p id="result"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
