<?xml version="1.0" encoding="UTF-8"?>
<!--
  FCE Icon / Favicon
  ==================
  Derived from fce-mark.svg - the invariant identity mark.
  
  This is the empty containment field: an identity that does not explain itself.
  Optimized for use at 16×16 and larger sizes.
  
  Specifications match canonical mark:
  - ViewBox: 0 0 100 100
  - Rounded square frame (path-based)
  - Corner radius: 9 units
  - Stroke width: 4 units
  - Stroke color: currentColor
  - Gap: Top edge, ~10 units (x=75 to x=85), near right corner
  - No fill, no decoration, no animation
-->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Path 1: Main frame (from gap start, clockwise around) -->
  <path
    d="M 75 10
       L 19 10
       A 9 9 0 0 1 10 19
       L 10 81
       A 9 9 0 0 1 19 90
       L 81 90
       A 9 9 0 0 1 90 81
       L 90 19
       A 9 9 0 0 1 81 10"
    fill="none"
    stroke="currentColor"
    stroke-width="4"
    stroke-linecap="butt"
    stroke-linejoin="miter"/>
  
  <!-- Path 2: Top edge segment after gap -->
  <path
    d="M 85 10
       L 81 10"
    fill="none"
    stroke="currentColor"
    stroke-width="4"
    stroke-linecap="butt"
    stroke-linejoin="miter"/>
</svg>
